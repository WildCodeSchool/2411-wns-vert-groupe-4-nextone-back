name: Deploy Backend

on:
  push:
    branches:
      - staging

jobs:
  test-backend:
    uses: ./.github/workflows/backend-pr-checks.yml
  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run codegen
        run: npm run ci-codegen
      - name: Build the backend
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
  docker:
    needs: [test-backend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist/
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextone-back-staging:latest
          platforms: linux/amd64,linux/arm64,linux/x86_64
  zap-scan:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Wait for webhook deployment
        run: sleep 120

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.BACKEND_STAGING_URL }}
          fail_action: true
          cmd_options: "-I"
