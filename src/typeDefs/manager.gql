scalar DateTime

enum ManagerRole {
  OPERATOR
  ADMIN
  SUPER_ADMIN
  NEXTONE_ADMIN
}

type CheckToken {
  id: ID
  email: String
  firstName: String
  lastName: String
  role: ManagerRole
  companyId: String
}

type Manager {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  role: ManagerRole!
  isGloballyActive: Boolean!
  authorizations: [Authorization!]!
  company: Company!
  connectionLogs: [ConnectionLog!]!
  ticketLogs: [TicketLog!]!
  createdAt: DateTime!
  updatedAt: DateTime!
  resetToken: String
  resetTokenExpiration: DateTime
}

type Auth {
  manager: Manager
  token: String
}

type Message {
  message: String
  success: Boolean
}

# 👉 PAGINATION : a décommenter pour activer la pagination
# type ManagersPaginatedResult {
#   items: [Manager!]!
#   totalCount: Int!
# }

type SortedManagers {
  active: [Manager!]!
  disable: [Manager!]!
}


type Query {
  # 👉 VERSION AVEC PAGINATION - décommenter cette ligne et commenter celle du dessous
  # managers(pagination: PaginationInput): ManagersPaginatedResult!
 
  managers: [Manager!]
  manager(id: ID!): Manager!
  login(infos: InputLogin!): Auth
  logout: Message!
  checkToken: CheckToken
  SortedManagers: SortedManagers!
}

type Mutation {
  createManager(infos: InputRegister!): Manager!
  deleteManager(id: ID!): Message!
  updateManager(id: ID!, data: UpdateManagerInput!): Manager!
  # associateManagerAtService(managerId: ID!, serviceId: ID!): Message!
  # dissociateManagerFromService(managerId: ID!, serviceId: ID!): Message!
  toggleGlobalAccessManager(id: UUID!): Message!
  askResetPassword(email: String!): Message!
  resetPassword(args: ResetPasswordInput!): Message!
}

input InputRegister {
  firstName: String! @constraint(pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 2)
  lastName: String! @constraint(pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 2)
  email: String! @constraint(format: "email", maxLength: 50)
  password: String! @constraint(maxLength: 100, minLength: 6)
  confirmPassword: String! @constraint(maxLength: 100, minLength: 6)
  invitationToken: String!
  # role: ManagerRole = OPERATOR
  isGloballyActive: Boolean = FALSE
  # companyId: UUID!
}

input InputLogin {
  email: String!
  password: String!
}

input UpdateManagerInput {
  firstName: String @constraint(pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 2)
  lastName: String @constraint(pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 2)
  role: ManagerRole
}

input ResetPasswordInput {
  resetToken : String!
  newPassword: String! @constraint(maxLength: 100, minLength: 6)
  confirmNewPassword: String! @constraint(maxLength: 100, minLength: 6)
  email: String! @constraint(format: "email", maxLength: 50)
}

