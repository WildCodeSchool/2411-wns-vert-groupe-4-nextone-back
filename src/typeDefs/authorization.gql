#authorization

scalar DateTime
scalar UUID

####### Types
type Authorization {
  service: Service!
  manager: Manager!
  isAdministrator: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Query {
  getServiceAuthorizations(serviceId: UUID!): [Authorization!]!
  getEmployeeAuthorizations(managerId: UUID!): [Authorization!]!
}

type Mutation {
  addAuthorization(input: NewAuthInput!): AuthorizationResponse!
  updateAuthorization(input: UpdateAuthInput!): AuthorizationResponse!
  deleteAuthorization(input: DeleteAuthInput!): AuthorizationResponse!
  addBulkAuthorization(input: AddBulkAuthInput!): AuthorizationResponse!
  deleteBulkAuthorization(input: DeleteBulkAuthInput!): AuthorizationResponse!
}

type AuthorizationResponse {
  message: String!
  success: Boolean!
}

### Input
input NewAuthInput {
  serviceId: UUID!
  managerId: UUID! 
  isAdministrator: Boolean
}

input UpdateAuthInput {
  serviceId: UUID! 
  managerId: UUID! 
  isAdministrator: Boolean
}

input DeleteAuthInput {
  serviceId: UUID! 
  managerId: UUID! 
}

input AddBulkAuthInput {
  authsToAdd: [NewAuthInput]!
}

input DeleteBulkAuthInput {
  authsToDelete: [DeleteAuthInput]!
}
