scalar DateTime


type Setting {
  id: ID!
  name: String!
  value: String!
  company: Company!
  createdAt: DateTime
  updatedAt: DateTime
}

type Query {
  settings(pagination: PaginationInput): [Setting!]!
  setting(id: ID!): Setting
  settingsByProperties(fields: SettingsByPropertiesInput!): [Setting!]!
}

type DeleteResponseSetting {
  message: String!
  success: Boolean!
}

input SettingsByPropertiesInput {
  name: String 
  value: String 
  companyId: UUID 
  pagination: PaginationInput
  createdAt: DateTime
  updatedAt: DateTime
}

type Mutation {
  createSetting(data: CreateSettingInput!): Setting!
  deleteSetting(id: ID!): DeleteResponseSetting!
  updateSetting(data: UpdateSettingInput!): Setting
}

input CreateSettingInput {
  name: String! @constraint(pattern: "^[0-9a-zA-Z]*$", maxLength: 50, minLength: 3)
  value: String! @constraint(pattern: "^[0-9a-zA-Z]*$", maxLength: 50, minLength: 3)
  companyId: UUID! @constraint(pattern: "uuid")
}

input UpdateSettingInput {
  id: ID! @constraint(pattern: "uuid")
  name: String @constraint(pattern: "^[0-9a-zA-Z]*$", maxLength: 50, minLength: 3)
  value: String @constraint(pattern: "^[0-9a-zA-Z]*$", maxLength: 50, minLength: 3)
}


