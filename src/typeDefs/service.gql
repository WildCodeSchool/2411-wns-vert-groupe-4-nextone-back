scalar UUID
scalar DateTime

####### Types

type Service {
  id: UUID!
  name: String!
  isGloballyActive: Boolean!
  authorizations: [Authorization!]
  company: Company!
  tickets: [Ticket!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Query {
  services: [Service!]!
  service(id: UUID!): Service
  servicesByKey(key: String!): [Service!]!
}

type Mutation {
  createService(data: CreateServiceInput!): Service!
  updateService(id: UUID!, data: UpdateServiceInput!): ServiceResponse!
  deleteService(id: UUID!): ServiceResponse!
  toggleGlobalAccessService(id: UUID!): ServiceResponse!
}

type ServiceResponse {
  message: String!
  success: Boolean!
}

### Input
input CreateServiceInput {
  name: String! @constraint(pattern: "^[0-9a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 3)
  companyId: UUID!
  isGloballyActive: Boolean
}

input UpdateServiceInput {
  name: String @constraint(pattern: "^[0-9a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,50}$", maxLength: 50, minLength: 3)
}

# ============================================================================
#  SUBSCRIPTIONS (WebSocket)
# ============================================================================
type Subscription {
  serviceToggled: Service!
}
