scalar DateTime
scalar UUID

enum Status {
  CREATED
  CANCELED
  DONE
  PENDING
  ARCHIVED
  INPROGRESS
}

type TicketLog {
  id: UUID!
  ticket: Ticket!
  manager: Manager
  status: Status!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TicketLogsPaginatedResult {
  items: [TicketLog!]!
  totalCount: Int!
}

type Query {
  ticketLog(id: UUID!): TicketLog
  ticketLogs(pagination: PaginationInput): TicketLogsPaginatedResult!
  ticketLogsByProperty(
    field: TicketLogPropertyInput!
    pagination: PaginationInput
  ): TicketLogsPaginatedResult!
 
    ticketLogsByProperties(
    fields: TicketLogPropertiesInput!
    pagination: PaginationInput
  ): TicketLogsPaginatedResult!
 
   ticketLogsByCreationSlot(data: ByCreationSlotInput!): TicketLogsPaginatedResult!
}

type Mutation {
  createTicketLog(data: CreateTicketLogInput!): TicketLog!
  updateTicketLog(data: UpdateTicketLogInput!): TicketLog
  deleteTicketLog(id: UUID!): DeleteResponse!
}

input ByCreationSlotInput {
  start: DateTime!
  end: DateTime!
  name: String!
  pagination: PaginationInput
}

input TicketLogPropertyInput @oneOf {
  ticketId: UUID
  managerId: UUID
  status: Status
  createdAt: DateTime
  updatedAt: DateTime
}

input TicketLogPropertiesInput  {
  ticketId: UUID
  managerId: UUID
  status: Status
  createdAt: DateTime
  updatedAt: DateTime
}

type DeleteResponse {
  message: String!
  success: Boolean!
}
# type DeleteResponse {
#   content: String!
#   success: Boolean!
# }

input CreateTicketLogInput {
  ticketId: UUID! 
  managerId: UUID 
  status: Status
}

input UpdateTicketLogInput {
  id: UUID! 
  status: Status!
  managerId: UUID 
}
