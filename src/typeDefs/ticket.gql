scalar DateTime

type Ticket {
  id: ID!
  code: String!
  firstName: String
  lastName: String
  email: String!
  phone: String
  status: Status
  service: Service!
  ticketLogs: [TicketLog!]!
  createdAt: DateTime
  updatedAt: DateTime
}

type TicketsPaginatedResult {
  items: [Ticket!]!
  totalCount: Int!
}

type Query {
  tickets(pagination: PaginationInput): TicketsPaginatedResult!
  ticket(id: ID!): Ticket
  ticketsByProperties(
    fields: TicketPropertiesInput
    pagination: PaginationInput
  ): TicketsPaginatedResult!

  ticketsForTVDisplay: [Ticket!]
}

type Mutation {
  generateTicket(data: GenerateTicketInput!): Ticket!
  deleteTicket(id: ID!): DeletedTicketResponse!
  updateTicket(data: UpdateTicketInput!): Ticket
  updateTicketStatus(data: UpdateStatusTicketInput!): Ticket!
}

