enum Order {
  ASC
  DESC
}

input PaginationInput {
  cursor: DateTime
  created: DateTime
  limit: Int
  order: Order
}

input TicketPropertiesInput {
  firstName: String
  lastName: String
  email: String
  phone: String
  status: [Status!]
  serviceId: ID
  createdAt: DateTime
  updatedAt: DateTime
}

input UpdateStatusTicketInput {
  id: ID!
  status: Status!
}

input GenerateTicketInput {
  firstName: String
  lastName: String
  email: String!
  phone: String
  status: Status
  serviceId: ID!
}

input UpdateTicketInput {
  id: ID!
  code: String
  firstName: String
  lastName: String
  email: String
  phone: String
  status: Status
  serviceId: ID
}

type DeletedTicketResponse {
  success: Boolean!
  message: String
}

enum Status {
  CREATED
  CANCELED
  DONE
  PENDING
  ARCHIVED
  INPROGRESS
  DELETED
}

# ============================================================================
#  SUBSCRIPTIONS (WebSocket)
# ============================================================================
type Subscription {
  ticketAdded: Ticket!
  ticketCreated: Ticket!
  ticketUpdated: Ticket!
  ticketStatusChanged(ticketId: ID!): Ticket!
  ticketDeleted: ID!
  ticketsChanged: Ticket!
}
