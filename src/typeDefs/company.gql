scalar DateTime

type Company {
  id: ID!
  name: String!
  address: String!
  postalCode: String!
  city: String!
  siret: String!
  logoCompany: String
  email: String!
  phone: String!
  services: [Service!]!
  managers: [Manager!]!
  settings: [Setting!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Query {
  companies(pagination: PaginationInput): [Company!]!
  company(id: ID!): Company
  companiesByProperties(fields: CompanyByPropertiesInput!): [Company!]!
  companyByIP: Company!
}

type Mutation {
  createCompany(data: CreateCompanyInput!): Company!
  deleteCompany(id: ID!): DeleteResponseCompany!
  updateCompany(data: UpdateCompanyInput!): Company!
}

type DeleteResponseCompany {
  message: String!
  success: Boolean!
}
input CompanyByPropertiesInput {
  name: String
  address: String
  postalCode: String
  city: String
  siret: String
  email: String
  phone: String
  pagination: PaginationInput
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateCompanyInput {
  name: String!
    @constraint(
      pattern: "^[0-9a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{3,50}$"
      maxLength: 50
      minLength: 3
    )
  address: String!
    @constraint(
      pattern: "^[0-9a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,255}$"
      maxLength: 255
      minLength: 3
    )
  postalCode: String!
    @constraint(pattern: "^[0-9]*$", maxLength: 5, minLength: 5)
  city: String! @constraint(pattern: "^[a-zA-Z]*$", maxLength: 50, minLength: 3)
  siret: String! @constraint(pattern: "^[0-9 ]*$", maxLength: 17, minLength: 15)
  email: String! @constraint(format: "email", maxLength: 50)
  phone: String! @constraint(pattern: "^[0-9]*$", maxLength: 15, minLength: 10)
}

input UpdateCompanyInput {
  id: ID! @constraint
  name: String
    @constraint(
      pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{3,50}$"
      maxLength: 50
      minLength: 3
    )
  address: String
    @constraint(
      pattern: "^[a-zA-Zà-öø-ÿÀ-ÖØ-ß' -]{2,255}$"
      maxLength: 255
      minLength: 3
    )
  postalCode: String
    @constraint(pattern: "^[0-9]*$", maxLength: 5, minLength: 5)
  city: String @constraint(pattern: "^[a-zA-Z]*$", maxLength: 50, minLength: 3)
  siret: String @constraint(pattern: "^[0-9 ]*$", maxLength: 17, minLength: 15)
  email: String @constraint(format: "email", maxLength: 50)
  phone: String @constraint(pattern: "^[0-9]*$", maxLength: 15, minLength: 10)
}
