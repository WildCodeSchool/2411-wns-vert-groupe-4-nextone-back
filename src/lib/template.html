<body>
  <div
    style="
      display: flex;
      flex-direction: column;
      justify-content: start;
      margin: auto;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px #a4acb9;
      max-width: 600px;
      font-family: sans-serif;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: start;
        padding-left: 1rem;
        row-gap: 3;
        background-color: #e6efef;
        border-radius: 10px 10px 0 0;
      "
    >
      <img src="cid:logo" height="40px" width="40px" alt="NextONE" Logo />
      <h1 style="color: #1f2511; font-weight: bolder">NextONE</h1>
    </div>
    <div
      style="
        color: #6d6d6d;
        display: flex;
        flex-direction: column;
        align-items: start;
        padding: 2rem;
        font-size: 0.9rem;
      "
    >
      <p>
        Une demande de réinitialisation de mot de passe a été effectué avec
        cette adresse email.
      </p>
      <p style="font-weight: bold">
        Pour finaliser la la demande, merci de cliquer sur le lien ci-dessous
      </p>
    </div>
    <a
      style="
        padding: 0.7rem;
        border-radius: 10px;
        background-color: #1f2511;
        border: none;
        color: white;
        font-weight: bold;
        text-decoration: none;
        align-self: center;
      "
      target="_blank"
      href="${uri}/resetpassword/${token}"
    >
      Réinitialiser le mot de passe
    </a>
    <p
      style="
        font-size: 0.6rem;
        color: gray;
        font-style: italic;
        padding-bottom: 1rem;
        margin: auto;
      "
    >
      Ceci est un email automatique; merci de ne pas y répondre
    </p>
  </div>
</body>
